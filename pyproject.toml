[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nextbrain-autoresearch"
version = "0.4.0"
description = "Auditable, freeze-gated skills for human-directed auto-research"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "NextBrain contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
openai = ["openai>=1.99.0"]
dev = ["build>=1.2", "pytest>=8.0", "ruff>=0.12"]

[project.scripts]
autoresearch = "autoresearch.cli:main"
researchos = "researchos.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
autoresearch = ["builtin_skills/*/SKILL.md", "builtin_skills/*/agents/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep the original lint policy stable across Ruff releases and CI environments.
select = ["E4", "E7", "E9", "F"]
